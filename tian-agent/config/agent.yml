#external_data_path: data/external/records.csv

# ===================== A-MEM 风格「对话记忆」（替代原滑动窗口+摘要；与备忘录等业务无关）=====================
agentic_memory_enabled: true
agentic_memory_persist_dir: data/agentic_memory
agentic_chroma_persist_dir: data/agentic_chroma
agentic_chroma_collection: episodic_mem
# 新笔记用向量在「本会话」内建链：取最相关的 K 条旧笔记 id 写入 links
agentic_link_k: 5
# 用户当前问句向量检索
agentic_retrieve_k: 8
# 除检索出的笔记外，仍保留最近若干轮原文（1 轮≈1 user+1 assistant）
agentic_recent_rounds: 4
# 与 A-mem-sys process_memory 中 find_related 的 k 一致：参与演进决策的近邻条数
agentic_evolution_neighbor_k: 5
# 一次注入上下文的最多笔记条数（含链接扩展）
agentic_max_expand_total: 20

# 兼容：仅当未配置 agentic_recent_rounds 时不再使用（沿用旧键名作兜底）
conversation_window_rounds: 4

# 完整对话消息列表（按 session_id 存 JSON，供换设备/清 localStorage 后仍可从服务端拉取）
chat_history_store_dir: data/chat_history

# unify-gateway 根地址（/unify-api 前缀与前端一致）。可被环境变量 UNIFY_API_BASE_URL 覆盖。
unify_api_base_url: "http://127.0.0.1:7070"
